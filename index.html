<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTE Engine - Chess Elo Estimator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            color: #38bdf8;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
            color: #fff;
        }
        .result {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 24px;
        }
        .error {
            color: #f87171;
        }
        .success {
            color: #4ade80;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>GTE Engine</h1>
    <input type="text" id="gameUrl" placeholder="Paste Chess.com game link...">
    <button id="revealBtn" onclick="toggleReveal()">REVEAL ESTIMATE</button>
    <div id="result" class="result"></div>
</div>

<script>
async function toggleReveal() {
    const inputUrl = document.getElementById('gameUrl').value.trim();
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('revealBtn');

    if (!inputUrl) {
        resultDiv.className = "result error";
        resultDiv.innerText = "Please enter a valid Chess.com link!";
        return;
    }

    resultDiv.className = "result";
    resultDiv.innerText = "Calculating (If Render is waking up, takes 30-40s)...";
    btn.disabled = true;

    try {
        console.log("Sending request to Python server...");
        const response = await fetch('https://gte-engine-backend.onrender.com/api/get-elo', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ game_url: inputUrl })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            resultDiv.className = "result success";
            resultDiv.innerText = `Estimated Elo: ${data.elo || data.estimated_elo || 'Calculated'}`;
        } else {
            resultDiv.className = "result error";
            resultDiv.innerText = data.error || "Estimate could not be retrieved.";
        }
    } catch (err) {
        console.error(err);
        resultDiv.className = "result error";
        resultDiv.innerText = "Connection failed. Check F12 console or python server.";
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
